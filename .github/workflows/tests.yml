name: Planner regression gates
on: [push, pull_request]
jobs:
  cpp-http:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { build: Debug, sanitizers: 'OFF' }
          - { build: Release, sanitizers: 'OFF' }
          - { build: Debug, sanitizers: 'ON' }
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r pune_route_planner/tools/requirements.txt && python3 pune_route_planner/tests/test_importer.py
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build }} -DENABLE_SANITIZERS=${{ matrix.sanitizers }}
      - run: cmake --build build --parallel 2
      - shell: bash
        run: |
          set +e; ctest --test-dir build --output-on-failure --no-tests=error > ctest.log 2>&1; rc=$?; cat ctest.log | tail -n 80; if [ $rc -ne 0 ]; then echo "::error title=ctest failed::$(tail -c 3500 ctest.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"; fi; exit $rc
        env:
          ASAN_OPTIONS: detect_leaks=1:quarantine_size_mb=16
          UBSAN_OPTIONS: halt_on_error=1
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cmake -S . -B build && cmake --build build --parallel 2
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: pune_route_planner/tests
      - run: |
          build/pune_route_planner/pune_route_planner --test-fixture --data pune_route_planner/tests/fixtures/pune_demo.json --web pune_route_planner/web --port 8087 > server.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          npm test --prefix pune_route_planner/tests
      - run: |
          build/pune_route_planner/pune_route_planner --data pune_route_planner/data/pune_driving.json --web pune_route_planner/web_real --port 8088 > real-server.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in $(seq 60); do curl -sf http://127.0.0.1:8088/api/stats >/dev/null && break; sleep 1; done
          set +e
          node pune_route_planner/tests/test_real_ui.cjs > ui.log 2>&1; r1=$?
          node pune_route_planner/tests/test_real_ui_flows.cjs >> ui.log 2>&1; r2=$?
          tail -n 40 ui.log
          if [ $r1 -ne 0 ] || [ $r2 -ne 0 ]; then echo "::error title=real UI tests failed::$(tail -c 3000 ui.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g') SERVER: $(tail -c 500 real-server.log | tr '\n' ' ')"; exit 1; fi
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build && cmake --build build --config Release --parallel 2
      - shell: bash
        run: |
          set +e; ctest --test-dir build -C Release -E RealData --output-on-failure --no-tests=error > ctest.log 2>&1; rc=$?; cat ctest.log | tail -n 80; if [ $rc -ne 0 ]; then echo "::error title=ctest failed::$(tail -c 3500 ctest.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"; fi; exit $rc
  package:
    runs-on: ubuntu-latest
    needs: [cpp-http]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2 && cmake --install build --prefix release
      - run: tar -czf pune-route-planner-linux.tar.gz release
      - uses: actions/upload-artifact@v4
        with: { name: pune-route-planner-linux, path: pune-route-planner-linux.tar.gz }
